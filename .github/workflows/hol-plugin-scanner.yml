name: HOL Plugin Scanner

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@b5ded48595ed489e35f2b92f7fb32e3b16960417 # v1 / v1.2.265
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          config: .plugin-scanner.toml
          # Cisco findings inside IntegrationResult are not path-rebased by
          # plugin-scanner==2.0.864, so exact ignore_paths cannot reliably suppress
          # its reviewed false positives on documented skill network capability.
          # Keep this category off until that behavior is revalidated. Repository
          # security gates and the other HOL checks remain enabled.
          cisco_skill_scan: "off"
