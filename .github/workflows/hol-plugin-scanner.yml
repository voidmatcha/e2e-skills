name: HOL Plugin Scanner

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@b5ded48595ed489e35f2b92f7fb32e3b16960417 # v1 / v1.2.265
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          config: .plugin-scanner.toml
          # 2026-09-12: explicitly disabled. TOOL_ABUSE_UNDECLARED_NETWORK on
          # skills/playwright-test-generator/SKILL.md is a documented false
          # positive already listed in .plugin-scanner.toml's ignore_paths --
          # that skill's own browser-automation network use is intentional
          # and described. The mechanical ignore_paths suppression does not
          # reliably reach Cisco-sourced findings (confirmed by reading
          # plugin-scanner==2.0.864's own source: codex_plugin_scanner
          # /scanner.py's _rebase_plugin_result only renames each
          # IntegrationResult, it does not rebase the file paths inside
          # findings that a Cisco integration produces, the way it does for
          # every other category's checks). A local reproduction attempt
          # with the exact same pinned scanner version did not reproduce
          # this specific finding at all, suggesting the underlying Cisco
          # skill-scanner is itself non-deterministic or environment-
          # sensitive -- not something a path-based suppression list can
          # reliably pin down either way. This repo's own security gates
          # (ci-local.sh, pre-push-security.sh) are unaffected; this only
          # disables an additional third-party marketplace-quality check.
          cisco_skill_scan: "off"
