name: E2E Skills CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-skills-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed-file selector needs the PR merge base.

      # Hosted runtimes may live in the versioned toolcache. Bind the runner's
      # Node and coherent npm package into the fixed paths accepted by CI.
      - name: Bind hosted Node and npm to trusted paths
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          hosted_node="$(command -v node)"
          hosted_node="$(realpath "$hosted_node")"
          case "$hosted_node" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "Refusing a project-local Node executable: $hosted_node" >&2
              exit 1
              ;;
          esac
          test -f "$hosted_node" && test -x "$hosted_node"
          if [[ "$hosted_node" != /usr/local/bin/node ]]; then
            sudo ln -sfn -- "$hosted_node" /usr/local/bin/node
          fi
          sudo chmod go-w -- "$hosted_node"
          hosted_npm="$(command -v npm)"
          hosted_npm="$(realpath "$hosted_npm")"
          case "$hosted_npm" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "Refusing a project-local npm entry point: $hosted_npm" >&2
              exit 1
              ;;
          esac
          case "$hosted_npm" in
            */npm/bin/npm-cli.js) ;;
            *) echo "Refusing an unrecognized npm entry point" >&2; exit 1 ;;
          esac
          test -f "$hosted_npm"
          hosted_npm_root="${hosted_npm%/bin/npm-cli.js}"
          sudo chmod go-w -- "$hosted_npm"
          if [[ "$(realpath -m -- /usr/local/lib/node_modules/npm)" != "$hosted_npm_root" ]]; then
            if [[ -e /usr/local/lib/node_modules/npm && ! -L /usr/local/lib/node_modules/npm ]]; then
              echo "Refusing to replace a different system npm directory" >&2
              exit 1
            fi
            sudo mkdir -p -- /usr/local/lib/node_modules
            sudo ln -sfnT -- "$hosted_npm_root" /usr/local/lib/node_modules/npm
          fi
          /usr/local/bin/node -e '
          const fs = require("node:fs");
          const metadata = fs.statSync(process.execPath);
          if (!metadata.isFile() || (metadata.mode & 0o022) !== 0) process.exit(1);
          const path = require("node:path");
          const entry = fs.realpathSync("/usr/local/lib/node_modules/npm/bin/npm-cli.js");
          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          if (entry === workspace || entry.startsWith(workspace + path.sep)) process.exit(1);
          const npmMetadata = fs.statSync(entry);
          if (!npmMetadata.isFile() || (npmMetadata.mode & 0o022) !== 0) process.exit(1);
          '
          /usr/local/bin/node /usr/local/lib/node_modules/npm/bin/npm-cli.js --version

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run convention and security checks
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ci_args=(--full)
          if [[ "$CI_EVENT_NAME" == pull_request ]]; then
            ci_args=(--changed "$CI_BASE_SHA")
          fi
          # Keep generated output outside the checkout so the disposable
          # parity proof sees a stable publishable source snapshot.
          /bin/bash -p scripts/ci/ci-local.sh "${ci_args[@]}" | tee "$RUNNER_TEMP/ci-local-report.txt"

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-local-report
          path: ${{ runner.temp }}/ci-local-report.txt

      - name: Add job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## E2E Skills CI'
            echo
            if [ -f "$RUNNER_TEMP/ci-local-report.txt" ]; then
              echo 'The complete plain-text report is also available as the `ci-local-report` artifact.'
              echo
              echo '<details>'
              echo '<summary>Sanitized CI output</summary>'
              echo
              # Indented Markdown is literal code. Prefix every physical line
              # after removing terminal controls so source-controlled backticks,
              # HTML tags, or ANSI escapes cannot break out of the summary block.
              LC_ALL=C tr '\000-\010\013\014\016-\037\177' '?' \
                < "$RUNNER_TEMP/ci-local-report.txt" | sed 's/^/    /'
              echo
              echo '</details>'
            else
              echo 'CI report was not generated because an earlier step failed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Verify current fixture contracts without node_modules
        run: python3 scripts/ci/test-fixture-faults.py

      - name: Verify scanner no-follow preflight
        run: python3 scripts/ci/test-reviewer-scanner.py --preflight-only

  live-fixture-reproduction:
    # Run the real browser matrix for every published main snapshot while
    # keeping pull-request feedback deterministic and fast. Manual dispatch
    # remains available for an explicit rerun.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned fixture dependencies
        run: npm ci --prefix scripts/evals/fixtures

      - name: Install Chromium and Linux browser dependencies
        run: scripts/evals/fixtures/node_modules/.bin/playwright install --with-deps chromium

      - name: Reproduce the executable fault matrix
        run: |
          python3 scripts/evals/run-fixture-faults.py \
            --output "$RUNNER_TEMP/fixture-faults-live.json"

      - name: Upload live reproduction
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-faults-live
          path: ${{ runner.temp }}/fixture-faults-live.json

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pre-push security gate
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: /bin/bash -p scripts/ci/pre-push-security.sh
