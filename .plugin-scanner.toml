# HOL scans the full repository, including adversarial fixtures that exercise
# credential redaction and dynamic-execution detection. It also treats a
# descriptor-verified exact-byte module load as command injection, and confuses
# length-framed stdin plus RegExp.exec with file exfiltration and code execution.
# Suppress only those exact reviewed files; the repository's mandatory security
# gate still scans every tracked and unignored artifact.
#
# 2026-09-11: the HOL Plugin Scanner run on push c5e331b failed for the first
# time in 9 consecutive runs, with no relevant content change in the flagged
# files since the prior pass -- reproduced locally against a clean `git
# archive HEAD` checkout (matching exactly what actions/checkout provides,
# excluding gitignored local-only content like testbed/ and .handover/) with
# the pinned action's underlying `codex-plugin-scanner` package, which this
# workflow does not pin to an exact version. Six confirmed false positives,
# all on long-standing files, reviewed against the actual SARIF output:
# - scan.sh: HARDCODED_SECRET / SECRET_PASSWORD_VAR fire on the scanner's own
#   #14 "hardcoded credential candidate" rule definitions (the pattern source
#   text, not an embedded secret).
# - the three debugger/reviewer SKILL.md files: UNICODE_OBFUSCATED_INSTRUCTION
#   fires on ordinary YAML frontmatter (`--- name: ... description: ...`).
# - playwright-test-generator/scripts/preflight_target.py:
#   DATA_EXFIL_SOCKET_CONNECT fires on a legitimate `socket.getaddrinfo()`
#   target-reachability preflight check.
# - playwright-test-generator/SKILL.md: TOOL_ABUSE_UNDECLARED_NETWORK and
#   SOCIAL_ENG_MISLEADING_DESC fire on the skill's own documented browser
#   automation and network capability.
#
# 2026-09-12: ignore_paths above did not actually suppress a recurrence of
# TOOL_ABUSE_UNDECLARED_NETWORK on playwright-test-generator/SKILL.md in the
# hosted GitHub code-scanning alert for push 43520af, even though that exact
# file/rule pair is listed above and the false positive was already
# confirmed on 2026-09-11. Reading plugin-scanner==2.0.864's own source
# (codex_plugin_scanner/scanner.py's _rebase_plugin_result) shows every
# other category's findings get their file_path rebased from an absolute
# runner path to a repo-relative one before ignore_paths's fnmatch check
# runs, but each IntegrationResult (which is where a Cisco skill-scanner
# finding like this one originates) is only renamed, not rebased -- so
# ignore_paths's relative-path patterns cannot reliably match it. A local
# reproduction with the identical pinned scanner version did not reproduce
# this specific finding at all, so the underlying Cisco skill-scanner may
# also be non-deterministic; either way, path-based suppression is not a
# dependable control for Cisco-sourced findings specifically. Rather than
# keep re-confirming the same known false positive after every push,
# .github/workflows/hol-plugin-scanner.yml now sets `cisco_skill_scan: off`
# directly, with its own dated comment explaining why.
#
# 2026-09-18: push a8b9381 failed on HARDCODED_SECRET in one frozen
# healer-perturbation-v1 source snapshot, reproduced locally with
# plugin-scanner==2.0.864 against `git archive HEAD`. The snapshot embeds a
# byte copy of skills/e2e-reviewer/scripts/scan.sh, so this is the same #14
# rule-definition false positive already suppressed for scan.sh above. The
# snapshot is digest-pinned evidence and must not be edited; suppress only
# that exact file.
# Correction to the 2026-09-11 note: the action commit pinned in
# hol-plugin-scanner.yml reads plugin-scanner==2.0.864 from its own
# scanner-version.txt and verifies PyPI provenance before installing, so the
# scanner version does not drift between runs.
# Any new benchmark source snapshot that embeds a byte copy of scan.sh trips
# the same #14 finding; add its exact path here and to the pin in
# scripts/ci/test-security-gates.py when creating it.
#
# 2026-09-19: playwright-test-generator/exploration-preflight.md and
# imported-test-cases.md hold text moved verbatim out of that skill's
# SKILL.md (preflight, browser-guard, and imported-case mechanics). They
# document the same network capability the SKILL.md entry suppresses, so
# they are listed beside it rather than left to re-trigger the same finding.
# 2026-09-20: the four e2e-reviewer references hold Phase 0-3 and reporting
# text moved verbatim from that skill's SKILL.md. They inherit its scanner,
# network, credential, and untrusted-input examples, so keep their exact paths
# beside the original entry and the matching security-gate pin.
# 2026-09-20: debugger report acquisition, extraction, classification, and fix
# verification text moved verbatim into parallel on-demand references. They
# inherit the debugger entrypoints' command, credential, and artifact examples.
# 2026-09-20: generator environment, exploration, scenario, code, convention,
# agent-interoperability, and verification detail moved verbatim into its
# root-level point-of-use references. They inherit the entrypoint's command,
# network, credential, and untrusted-input examples.
#
# 2026-10-12: push 6ded5e9 (2.0.0) failed the scan for the first time since
# 2026-09-18, reproduced locally with plugin-scanner==2.0.864 against
# `git archive 6ded5e9`: nine HARDCODED_SECRET hits and one
# DANGEROUS_DYNAMIC_EXECUTION, all reviewed and all false positives. They are
