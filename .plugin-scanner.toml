# Exact reviewed false positives in current skills, helpers and test fixtures.
# The pinned HOL scanner (plugin-scanner==2.0.864) flags credential-pattern
# definitions, synthetic credentials and fixed-string test execution. Its Cisco
# integration also flags documented browser/network capabilities and ordinary
# skill frontmatter; the workflow separately disables that unreliable category.
# Descriptor-verified module loads and length-framed stdin/RegExp.exec are
# reviewed dynamic-execution/exfiltration false positives in the shipped helpers.
# Historical benchmark files live in the pinned HF snapshot and have no ignores
# here. Add a current path only after reviewing a reproduced scanner finding.
# The mandatory repository security gate still scans every tracked/unignored file.
[scanner]
ignore_paths = [
