name: playwright-test-generator
description: Generate new Playwright E2E tests from scratch — for a page, flow, form, or component — via coverage-gap analysis, live exploration only on local/disposable or externally isolated approved non-production targets, a scenario-approval gate, code generation, and a review handoff. Not for debugging failing Playwright tests (use playwright-debugger), reviewing tests that already pass (use e2e-reviewer), generating Cypress tests, or writing unit/component tests.
metadata:
  short-description: Generate reviewed Playwright E2E tests
allow_implicit_invocation: true
