name: e2e-reviewer
description: Review Playwright and Cypress E2E specs or PR/diff-scoped test changes against 24 anti-patterns grouped by P0/P1/P2 severity — silent always-pass bugs (name-assertion mismatch, missing assertions, error swallowing, missing auth setup, etc.), poor-diagnostic or sequencing patterns (missing await, raw DOM queries, hard-coded sleeps, flaky selectors, expect.soft overuse, etc.), and maintenance issues (YAGNI + zombie specs).
metadata:
  short-description: Audit E2E tests and diffs
allow_implicit_invocation: true
